#
# Restic backup of ns8-kumomta
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
# - settings.json: every setting (no secrets)
# - secrets/: 0600 secrets (API credentials, SMTP AUTH hashes, smarthost
#   password, webhook token, metrics password)
# - openbao.env: VAULT_ADDR and VAULT_TOKEN (0600)
# - dkim/: DKIM keys (only the public keys when OpenBao holds them)
# - kumomta/: the rendered policy (configure-module renders it again)
# - kumomta-spool: the queued messages
#
state/settings.json
state/secrets
state/openbao.env
state/dkim
state/kumomta
volumes/kumomta-spool
